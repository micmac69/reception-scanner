<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reception Desk Scanner — Exquisite Awards</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Library untuk Live Camera QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --gold: #c5a059;
      --bg-dark: #090d16;
      --surface: #111827;
      --border: #1f293d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* RESPONSIVE CONTAINER */
    .scanner-card {
      width: 100%;
      max-width: 920px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .top-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }
    .pin-box {
      width: 80px;
      background: #1a2333;
      border: 1px solid #2e3d59;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* LIVE STATS COUNTER GRID */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-box {
      background: #182234;
      border: 1px solid #24324a;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }
    .stat-lbl {
      font-size: 0.58rem;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .stat-val {
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      margin-top: 2px;
    }
    .stat-val.gold { color: var(--gold); }

    /* WORKSPACE GRID */
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 768px) {
      .workspace-grid {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
    }

    .panel-box {
      background: #141c2e;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .manual-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #182234;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      margin-bottom: 12px;
    }
    .manual-input:focus { border-color: var(--gold); }

    /* SEARCH DROPDOWN STYLING */
    .search-container {
      position: relative;
      margin-bottom: 12px;
    }
    .search-dropdown {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background: #0f1c2e;
      border: 1px solid rgba(197, 160, 89, 0.4);
      border-radius: 10px;
      margin-top: 4px;
      max-height: 220px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }
    .search-item {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }
    .search-item:hover {
      background: #1a2333;
    }
    .search-item-name {
      font-weight: 700;
      color: #fff;
      font-size: 0.85rem;
    }
    .search-item-sub {
      font-size: 0.7rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      margin-top: 2px;
    }

    /* LIVE CAMERA VIEWPORT */
    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      border: 1px solid #24324a;
      margin-bottom: 14px;
    }
    #reader video {
      object-fit: cover !important;
    }

    .result-card {
      display: none;
      padding: 16px;
      border-radius: 14px;
      margin-top: 12px;
      text-align: center;
    }
    .res-success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #10b981; }
    .res-warn { background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #f59e0b; }
    .res-danger { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #ef4444; }

    .guest-table-val {
      font-size: 1.25rem;
      font-weight: 900;
      margin-top: 6px;
    }

    /* TABLE OCCUPANTS BUTTON & MODAL */
    .table-check-btn {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid #d4af37;
      color: #d4af37;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      display: inline-block;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .table-check-btn:hover { background: rgba(212, 175, 55, 0.3); }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(9, 13, 22, 0.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 14px;
      width: 100%;
      max-width: 450px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid #1f293d;
      padding-bottom: 10px;
    }
    .modal-title { color: #d4af37; font-size: 0.95rem; font-weight: 800; text-transform: uppercase; }
    .close-modal { background: none; border: none; color: #9ca3af; font-size: 1.4rem; cursor: pointer; }
    .occupant-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #1f293d33;
      font-size: 0.85rem;
      text-align: left;
    }

    /* GRID MEJA INTERAKTIF */
    .section-lbl {
      font-size: 0.7rem;
      font-weight: 800;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .table-cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 2px;
    }
    @media (min-width: 768px) {
      .table-cards-grid { max-height: 380px; }
    }
    .table-floor-card {
      background: #182234;
      border: 1px solid #2e3d59;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .table-floor-card:active { transform: scale(0.97); }
    .table-floor-card.selected {
      background: rgba(197, 160, 89, 0.25);
      border-color: var(--gold);
    }
    .tf-name { font-size: 0.8rem; font-weight: 900; color: #fff; margin-bottom: 2px; }
    .tf-sub { font-size: 0.62rem; color: #94a3b8; margin-bottom: 4px; }
    .tf-occ { font-size: 0.72rem; font-weight: 700; color: #cbd5e1; }
    .tf-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 800;
      background: #24324a;
      color: #93c5fd;
    }
  </style>
</head>
<body>

  <div class="scanner-card">
    <div class="top-bar">
      <div class="top-title" id="pageTitle">RECEPTION DESK</div>
      <div>
        <span style="font-size: 0.7rem; color: #94a3b8; margin-right: 4px;">PIN:</span>
        <input type="password" id="staffPin" class="pin-box" value="2026">
      </div>
    </div>

    <!-- LIVE STATS COUNTER BAR -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-lbl">Registered</div>
        <div id="statReg" class="stat-val">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Checked In</div>
        <div id="statIn" class="stat-val gold">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Remaining</div>
        <div id="statRem" class="stat-val">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-lbl">Attendance</div>
        <div id="statRate" class="stat-val">0%</div>
      </div>
    </div>

    <!-- WORKSPACE -->
    <div class="workspace-grid">
      
      <!-- KOLOM KIRI: SCANNER & INPUT -->
      <div class="panel-box">
        <div class="section-lbl" style="margin-top:0;">Guest Identification</div>
        <input 
          type="text" 
          id="manualInput" 
          class="manual-input" 
          placeholder="Scan barcode or enter Guest ID..." 
          onkeydown="if(event.key==='Enter'){ triggerScan(this.value.trim()); this.value=''; }"
        >

        <!-- KOTAK PENCARIAN NAMA / PERUSAHAAN -->
        <div class="search-container">
          <input 
            type="text" 
            id="guestNameSearch" 
            class="manual-input" 
            style="margin-bottom: 0;"
            placeholder="🔍 Search guest by name or company..." 
            oninput="handleGuestSearch(this.value)" 
            autocomplete="off"
          >
          <div id="searchDropdown" class="search-dropdown"></div>
        </div>

        <!-- LIVE CAMERA VIEWPORT -->
        <div id="reader"></div>

        <!-- HASIL VALIDASI CHECK-IN -->
        <div id="resultBox" class="result-card">
          <h3 id="resTitle" style="font-size: 1.15rem; font-weight: 800;"></h3>
          <p id="resGuest" style="color: #cbd5e1; font-size: 0.9rem; margin-top: 4px; font-weight: 600;"></p>
          <div id="resTable" class="guest-table-val"></div>
          
          <!-- Tombol View Table Occupants -->
          <div>
            <button type="button" class="table-check-btn" onclick="openTableModal()">🔍 View Table Occupants</button>
          </div>
        </div>
      </div>

      <!-- KOLOM KANAN: TABEL & QUOTA -->
      <div class="panel-box">
        <div class="section-lbl" style="margin-top:0;">
          <span>Tables & Quota: <span id="activeOverrideText" style="color: var(--gold); font-size: 0.65rem;">(Default)</span></span>
          <span style="cursor: pointer; color: var(--gold);" onclick="refreshDashboardData()">⟳ Refresh</span>
        </div>
        <div id="tableFloorGrid" class="table-cards-grid">
          <div style="grid-column: span 2; text-align: center; color: #64748b; font-size: 0.75rem; padding: 20px;">Loading tables...</div>
        </div>
        <input type="hidden" id="selectedOverrideTable" value="">
      </div>

    </div>
  </div>

  <!-- MODAL POPUP: TABLE OCCUPANTS LIST -->
  <div id="tableOccupantsModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modalTableTitle">Table Occupants</div>
        <button type="button" class="close-modal" onclick="closeTableModal()">&times;</button>
      </div>
      <div id="occupantsListContainer" style="max-height: 260px; overflow-y: auto;">
        <div style="text-align: center; color: #9ca3af; padding: 20px; font-size: 0.85rem;">Loading occupants...</div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfFvxF5nIADv6uwLXA9sDtJYZmdN10h2SpE5Pa2bz2_Im0c-i1Ckwxv_M6OOWXAvdX/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const eventCode = urlParams.get('event') || "EA26-JKT";

    document.getElementById('pageTitle').innerText = "DESK — " + eventCode;

    let activeGuestId = "";
    let activeTableAssigned = "";
    let isProcessing = false;
    let selectedTableOverride = "";

    // FUNGSI PENCARIAN NAMA TAMU (LIVE SEARCH)
    let searchTimeout;
    function handleGuestSearch(query) {
      clearTimeout(searchTimeout);
      const dropdown = document.getElementById('searchDropdown');
      
      if (!query || query.trim().length < 2) {
        dropdown.style.display = 'none';
        return;
      }
      
      searchTimeout = setTimeout(() => {
        fetch(APPS_SCRIPT_URL + "?action=searchGuests&event=" + encodeURIComponent(eventCode) + "&q=" + encodeURIComponent(query.trim()) + "&t=" + Date.now())
          .then(res => res.json())
          .then(guests => {
            if (guests && guests.length > 0) {
              let html = '';
              guests.forEach(g => {
                html += `
                  <div class="search-item" onclick="selectSearchedGuest('${g.id}')">
                    <div class="search-item-name">${g.name}</div>
                    <div class="search-item-sub">
                      <span>${g.company}</span>
                      <span style="color: var(--gold); font-weight: 700;">${g.table}</span>
                    </div>
                  </div>
                `;
              });
              dropdown.innerHTML = html;
              dropdown.style.display = 'block';
            } else {
              dropdown.innerHTML = '<div style="padding: 12px; color: #94a3b8; font-size: 0.8rem; text-align: center;">No matching guests found</div>';
              dropdown.style.display = 'block';
            }
          })
          .catch(err => {});
      }, 300);
    }

    function selectSearchedGuest(passId) {
      document.getElementById('searchDropdown').style.display = 'none';
      document.getElementById('guestNameSearch').value = '';
      triggerScan(passId);
    }

    // FUNGSI AUDIO BEEP SYNTHESIZER
    function playBeepSound(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.18);
          osc.start();
          osc.stop(ctx.currentTime + 0.18);
        } else {
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.12);
          osc.start();
          osc.stop(ctx.currentTime + 0.12);
        }
      } catch (e) {}
    }

    function refreshDashboardData() {
      fetch(APPS_SCRIPT_URL + "?action=getLiveStats&event=" + encodeURIComponent(eventCode) + "&t=" + Date.now())
        .then(res => res.json())
        .then(stats => {
          if (stats) {
            document.getElementById('statReg').innerText = stats.registered || 0;
            document.getElementById('statIn').innerText = stats.checkedIn || 0;
            document.getElementById('statRem').innerText = stats.remaining || 0;
            document.getElementById('statRate').innerText = stats.rate || "0%";
          }
        }).catch(err => {});

      fetch(APPS_SCRIPT_URL + "?action=getTableAvailability&event=" + encodeURIComponent(eventCode) + "&t=" + Date.now())
        .then(res => res.json())
        .then(tables => {
          const grid = document.getElementById('tableFloorGrid');
          if (!grid || !Array.isArray(tables)) return;
          
          let html = `
            <div class="table-floor-card ${selectedTableOverride === '' ? 'selected' : ''}" onclick="selectTableOverride('')" style="grid-column: span 2;">
              <div class="tf-name">-- Keep Existing / Default Table --</div>
              <div class="tf-sub">Auto assign based on database</div>
            </div>
          `;
          
          tables.forEach(t => {
            const isSel = selectedTableOverride === t.name;
            html += `
              <div class="table-card table-floor-card ${isSel ? 'selected' : ''}" onclick="selectTableOverride('${t.name}')">
                <div class="tf-name">${t.name}</div>
                <div class="tf-sub">${t.zone || 'Main Zone'}</div>
                <div class="tf-occ">${t.occupied}/${t.capacity} Seats</div>
                <div class="tf-badge">${t.remaining} LEFT</div>
              </div>
            `;
          });
          grid.innerHTML = html;
        }).catch(err => {
          document.getElementById('tableFloorGrid').innerHTML = '<div style="grid-column: span 2; text-align: center; color: #ef4444; font-size: 0.75rem;">Failed to load tables</div>';
        });
    }

    function selectTableOverride(tableName) {
      if (selectedTableOverride === tableName) {
        selectedTableOverride = "";
        document.getElementById('activeOverrideText').innerText = "(Default)";
      } else {
        selectedTableOverride = tableName;
        document.getElementById('activeOverrideText').innerText = "(Override: " + tableName + ")";
      }
      document.getElementById('selectedOverrideTable').value = selectedTableOverride;
      refreshDashboardData();
    }

    function openTableModal() {
      if (!activeTableAssigned || activeTableAssigned === "UPON ARRIVAL" || activeTableAssigned === "FREE SEATING" || activeTableAssigned === "-") {
        alert("This guest has not been allocated a fixed table yet (Status: " + (activeTableAssigned || "None") + ").");
        return;
      }

      document.getElementById('modalTableTitle').innerText = "Occupants of " + activeTableAssigned;
      document.getElementById('tableOccupantsModal').style.display = 'flex';
      document.getElementById('occupantsListContainer').innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 20px; font-size: 0.85rem;">Loading table occupants...</div>';

      fetch(APPS_SCRIPT_URL + "?action=getTableOccupants&event=" + encodeURIComponent(eventCode) + "&table=" + encodeURIComponent(activeTableAssigned) + "&t=" + Date.now())
        .then(res => res.json())
        .then(occupants => {
          const container = document.getElementById('occupantsListContainer');
          if (!occupants || occupants.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 20px; font-size: 0.85rem;">No guests currently registered at this table.</div>';
            return;
          }

          let html = '';
          occupants.forEach(occ => {
            let statusColor = occ.status.toUpperCase() === 'CHECKED IN' ? '#34d399' : '#94a3b8';
            html += `<div class="occupant-item">
              <div>
                <div style="font-weight: 700; color: #fff;">${occ.name}</div>
                <div style="font-size: 0.72rem; color: #94a3b8; margin-top: 1px;">${occ.company}</div>
              </div>
              <span style="font-size: 0.68rem; font-weight: 700; color: ${statusColor}; text-transform: uppercase;">${occ.status}</span>
            </div>`;
          });
          container.innerHTML = html;
        })
        .catch(err => {
          document.getElementById('occupantsListContainer').innerHTML = '<div style="text-align: center; color: #ef4444; padding: 20px; font-size: 0.85rem;">Failed to load table occupants.</div>';
        });
    }

    function closeTableModal() {
      document.getElementById('tableOccupantsModal').style.display = 'none';
    }

    function onScanSuccess(decodedText) {
      if (isProcessing || activeGuestId === decodedText) return;
      triggerScan(decodedText);
    }

    function triggerScan(id) {
      if (!id || isProcessing) return;
      isProcessing = true;
      activeGuestId = id;

      const pin = document.getElementById('staffPin').value;
      const box = document.getElementById('resultBox');
      box.style.display = "block";
      box.className = "result-card res-warn";
      document.getElementById('resTitle').innerText = "VERIFYING...";
      document.getElementById('resGuest').innerText = "Pass ID: " + id;
      document.getElementById('resTable').innerText = "Please wait...";

      const checkInEndpoint = APPS_SCRIPT_URL + 
        "?action=checkIn&id=" + encodeURIComponent(id) + 
        "&pin=" + encodeURIComponent(pin) + 
        "&event=" + encodeURIComponent(eventCode) +
        "&table=" + encodeURIComponent(selectedTableOverride) +
        "&t=" + Date.now();

      fetch(checkInEndpoint)
        .then(response => response.json())
        .then(res => {
          if (res.status === "success" || res.status === "already_checked_in") {
            playBeepSound('success');
            box.className = "result-card " + (res.status === "success" ? "res-success" : "res-warn");
            document.getElementById('resTitle').innerText = res.status === "success" ? "✓ VALIDATED & CHECKED IN" : "⚠ ALREADY CHECKED IN";
            document.getElementById('resGuest').innerText = res.name + " (" + (res.company || "-") + ")" + (res.hasPlusOne ? " [+1 Guest]" : "");
            
            activeTableAssigned = res.table || "";
            document.getElementById('resTable').innerText = "TABLE: " + activeTableAssigned;
            refreshDashboardData();
          } else {
            playBeepSound('error');
            box.className = "result-card res-danger";
            document.getElementById('resTitle').innerText = "✕ REJECTED";
            document.getElementById('resGuest').innerText = res.message || "Invalid Pass ID or PIN";
            document.getElementById('resTable').innerText = "";
            activeTableAssigned = "";
          }
        })
        .catch(err => {
          playBeepSound('error');
          box.className = "result-card res-danger";
          document.getElementById('resTitle').innerText = "✕ CONNECTION ERROR";
          document.getElementById('resGuest').innerText = "Unable to reach server.";
          document.getElementById('resTable').innerText = "";
          activeTableAssigned = "";
        })
        .finally(() => {
          setTimeout(() => {
            isProcessing = false;
            activeGuestId = "";
          }, 2000);
        });
    }

    window.addEventListener("load", () => {
      refreshDashboardData();

      const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { fps: 15, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 }, 
        false
      );
      html5QrcodeScanner.render(onScanSuccess);
    });
  </script>
</body>
</html>
