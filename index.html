<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reception Desk — Exquisite Awards</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f293d;
      --gold: #c5a059;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .panel-card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .title { font-size: 1.05rem; font-weight: 800; color: var(--gold); }
    .pin-input {
      width: 90px;
      background: #1a2333;
      border: 1px solid #2e3d59;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .search-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #182234;
      color: #fff;
      font-size: 1rem;
      outline: none;
      font-weight: 500;
    }
    .search-input:focus { border-color: var(--gold); }

    /* Hasil Quick Search */
    .guest-list {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }
    .guest-item {
      background: #182234;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.15s;
    }
    .guest-item:hover { background: #1e2c44; }
    .guest-name { font-weight: 700; font-size: 0.95rem; }
    .guest-meta { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    
    .btn-action {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
    }
    .btn-checkin { background: var(--gold); color: #000; }
    .badge-in { background: rgba(16, 185, 129, 0.15); color: var(--success); padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; }

    /* Modal / Alert Notifikasi */
    .status-banner {
      display: none;
      padding: 14px;
      border-radius: 10px;
      margin-top: 14px;
      text-align: center;
      font-weight: 700;
    }
    .status-ok { background: rgba(16, 185, 129, 0.15); border: 1px solid var(--success); color: var(--success); }
    .status-dup { background: rgba(245, 158, 11, 0.15); border: 1px solid var(--warn); color: var(--warn); }
  </style>
</head>
<body>

  <div class="panel-card">
    <div class="top-bar">
      <div class="title">RECEPTION DESK</div>
      <div>
        <span style="font-size: 0.75rem; color: var(--muted);">PIN:</span>
        <input type="password" id="staffPin" class="pin-input" value="2026">
      </div>
    </div>

    <!-- Input Search Tamu / Scan Gun -->
    <input 
      type="text" 
      id="searchInput" 
      class="search-input" 
      placeholder="Ketik Nama Tamu, Instansi, atau ID..." 
      oninput="onSearchFilter(this.value)"
      onkeydown="if(event.key==='Enter'){ handleBarcodeEnter(this.value.trim()); }"
      autofocus
    >

    <div id="statusBanner" class="status-banner"></div>

    <!-- Daftar Pencarian Interaktif -->
    <div class="guest-list" id="guestContainer">
      <div style="text-align: center; color: var(--muted); padding: 30px 10px; font-size: 0.85rem;">
        Memuat master database tamu...
      </div>
    </div>
  </div>

  <script>
    const eventCode = "<?= eventCode ?>";
    let masterGuests = [];

    window.onload = function() {
      loadEventGuests();
    };

    function loadEventGuests() {
      google.script.run.withSuccessHandler(function(data) {
        masterGuests = data || [];
        renderList(masterGuests);
      }).getEventReservations(eventCode);
    }

    function renderList(list) {
      const container = document.getElementById('guestContainer');
      if (list.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:30px;">Tamu tidak ditemukan.</div>';
        return;
      }

      let html = "";
      list.forEach(g => {
        const isChecked = (g.status === "Checked In");
        html += `
          <div class="guest-item">
            <div>
              <div class="guest-name">${g.name}</div>
              <div class="guest-meta">${g.company} &bull; <b style="color:var(--gold);">Table: ${g.table}</b></div>
              <div class="guest-meta" style="font-family: monospace;">ID: ${g.id}</div>
            </div>
            <div>
              ${isChecked 
                ? `<span class="badge-in">✓ Checked In</span>` 
                : `<button class="btn-action btn-checkin" onclick="executeCheckIn('${g.id}')">Check-In</button>`
              }
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function onSearchFilter(query) {
      const q = query.toLowerCase().trim();
      if (!q) {
        renderList(masterGuests);
        return;
      }
      const filtered = masterGuests.filter(g => 
        g.name.toLowerCase().includes(q) || 
        g.company.toLowerCase().includes(q) || 
        g.id.toLowerCase().includes(q) ||
        g.table.toLowerCase().includes(q)
      );
      renderList(filtered);
    }

    function handleBarcodeEnter(rawVal) {
      if (!rawVal) return;
      // Jika input berasal dari Barcode Scanner Gun
      executeCheckIn(rawVal);
      document.getElementById('searchInput').value = "";
    }

    function executeCheckIn(guestId) {
      const pin = document.getElementById('staffPin').value;
      const banner = document.getElementById('statusBanner');
      banner.style.display = "none";

      google.script.run.withSuccessHandler(function(res) {
        banner.style.display = "block";
        if (res.status === "success") {
          banner.className = "status-banner status-ok";
          banner.innerHTML = `✓ ${res.name} — BERHASIL CHECK-IN<br><span style="font-size:0.85rem; font-weight:500;">Meja: ${res.table}</span>`;
          loadEventGuests(); // Sinkronkan ulang daftar
        } else if (res.status === "already_checked_in") {
          banner.className = "status-banner status-dup";
          banner.innerHTML = `⚠️ ${res.name} SUDAH PERNAH CHECK-IN<br><span style="font-size:0.85rem; font-weight:500;">Meja: ${res.table}</span>`;
        } else {
          banner.className = "status-banner status-dup";
          banner.innerText = res.message;
        }
      }).processReceptionCheckIn(guestId, pin, eventCode);
    }
  </script>
</body>
</html>
