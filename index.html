<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reception Scanner Desk — Exquisite Awards</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #090d16;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .scanner-card {
      width: 100%;
      max-width: 460px;
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .top-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: #c5a059;
      letter-spacing: -0.01em;
    }
    .pin-box {
      width: 90px;
      background: #1a2333;
      border: 1px solid #2e3d59;
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
    }
    .manual-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #182234;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      margin-bottom: 14px;
    }
    .manual-input:focus { border-color: #c5a059; }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid #24324a;
      min-height: 240px;
    }

    .result-card {
      display: none;
      padding: 16px;
      border-radius: 12px;
      margin-top: 14px;
      text-align: center;
    }
    .res-success { background: rgba(16, 185, 129, 0.12); border: 1px solid #10b981; color: #10b981; }
    .res-warn { background: rgba(245, 158, 11, 0.12); border: 1px solid #f59e0b; color: #f59e0b; }
    .res-danger { background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; color: #ef4444; }

    .guest-table-val {
      font-size: 1.35rem;
      font-weight: 900;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="scanner-card">
    <div class="top-bar">
      <div class="top-title">RECEPTION DESK</div>
      <div>
        <span style="font-size: 0.75rem; color: #94a3b8; margin-right: 4px;">PIN:</span>
        <input type="password" id="staffPin" class="pin-box" value="2026">
      </div>
    </div>

    <input 
      type="text" 
      id="manualInput" 
      class="manual-input" 
      placeholder="ID Tamu / Barcode Gun..." 
      onkeydown="if(event.key==='Enter'){ triggerScan(this.value.trim()); this.value=''; }"
    >

    <div id="reader"></div>

    <div id="resultBox" class="result-card">
      <h3 id="resTitle" style="font-size: 1.15rem; font-weight: 800;"></h3>
      <p id="resGuest" style="color: #cbd5e1; font-size: 0.92rem; margin-top: 4px; font-weight: 600;"></p>
      <div id="resTable" class="guest-table-val"></div>
    </div>
  </div>

  <script>
    // TEMPELKAN LINK EXEC DARI APPS SCRIPT ANDA DI SINI:
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfFvxF5nIADv6uwLXA9sDtJYZmdN10h2SpE5Pa2bz2_Im0c-i1Ckwxv_M6OOWXAvdX/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const eventCode = urlParams.get('event') || "EA26-JKT";

    let activeGuestId = "";
    let isProcessing = false;

    function onScanSuccess(decodedText) {
      if (isProcessing || activeGuestId === decodedText) return;
      triggerScan(decodedText);
    }

    function triggerScan(id) {
      if (!id || isProcessing) return;
      isProcessing = true;
      activeGuestId = id;

      const pin = document.getElementById('staffPin').value;
      const box = document.getElementById('resultBox');
      box.style.display = "block";
      box.className = "result-card";
      document.getElementById('resTitle').innerText = "MEMVALIDASI...";
      document.getElementById('resGuest').innerText = "Menghubungkan ke server...";
      document.getElementById('resTable').innerText = "";

      // Mengirim check-in ke Google Sheets
      const targetUrl = APPS_SCRIPT_URL + 
        "?action=checkIn&id=" + encodeURIComponent(id) + 
        "&pin=" + encodeURIComponent(pin) + 
        "&event=" + encodeURIComponent(eventCode);

      fetch(targetUrl)
        .then(response => response.json())
        .then(res => {
          if (res.status === "success") {
            box.className = "result-card res-success";
            document.getElementById('resTitle').innerText = "✓ BERHASIL CHECK-IN";
            document.getElementById('resGuest').innerText = res.name + " (" + res.company + ")";
            document.getElementById('resTable').innerText = "TABLE: " + res.table;
          } else if (res.status === "already_checked_in") {
            box.className = "result-card res-warn";
            document.getElementById('resTitle').innerText = "⚠️ SUDAH CHECK-IN (DITAYANGKAN)";
            document.getElementById('resGuest').innerText = res.name + " (" + res.company + ")";
            document.getElementById('resTable').innerText = "TABLE: " + res.table;
          } else {
            box.className = "result-card res-danger";
            document.getElementById('resTitle').innerText = "✕ GAGAL";
            document.getElementById('resGuest').innerText = res.message || "ID tidak ditemukan";
            document.getElementById('resTable').innerText = "";
          }

          setTimeout(() => {
            isProcessing = false;
            activeGuestId = "";
          }, 2500);
        })
        .catch(err => {
          box.className = "result-card res-warn";
          document.getElementById('resTitle').innerText = "✓ SCAN TERKIRIM";
          document.getElementById('resGuest').innerText = "ID: " + id;
          document.getElementById('resTable').innerText = "Memproses di Sheets...";
          
          setTimeout(() => {
            isProcessing = false;
            activeGuestId = "";
          }, 2500);
        });
    }

    window.addEventListener("load", () => {
      const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader", 
        { 
          fps: 15, 
          qrbox: { width: 220, height: 220 },
          aspectRatio: 1.0,
          showTorchButtonIfSupported: true
        }, 
        false
      );
      html5QrcodeScanner.render(onScanSuccess);
    });
  </script>
</body>
</html>
