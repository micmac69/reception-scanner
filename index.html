<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Reception Desk Scanner — Exquisite Awards</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    :root {
      --gold: #c5a059;
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f293d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: #f8fafc;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .scanner-card {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .top-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .pin-box {
      width: 80px;
      background: #1a2333;
      border: 1px solid #2e3d59;
      color: #fff;
      padding: 5px 8px;
      border-radius: 6px;
      text-align: center;
      font-weight: 700;
      font-size: 0.85rem;
    }

    /* LIVE STATS */
    .live-stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: #141c2e;
      border: 1px solid #25334d;
      border-radius: 12px;
      padding: 8px 6px;
      margin-bottom: 14px;
      text-align: center;
    }
    .stat-item { display: flex; flex-direction: column; }
    .stat-lbl { font-size: 0.62rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.04em; }
    .stat-num { font-size: 1.15rem; font-weight: 900; color: #ffffff; margin-top: 2px; }
    .stat-num.highlight { color: var(--gold); }
    .stat-num.green { color: #34d399; }

    .manual-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #182234;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      margin-bottom: 12px;
    }
    .manual-input:focus { border-color: var(--gold); }

    .cam-trigger-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: linear-gradient(135deg, #c5a059 0%, #a37d32 100%);
      color: #0b0f17;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(197, 160, 89, 0.25);
    }
    .cam-trigger-btn:active { transform: scale(0.98); }
    .cam-trigger-btn span { font-size: 0.74rem; font-weight: 600; opacity: 0.85; margin-top: 3px; }

    .loading-status {
      display: none;
      text-align: center;
      margin-top: 12px;
      font-size: 0.82rem;
      color: var(--gold);
      font-weight: 600;
    }

    .result-card {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin-top: 14px;
      text-align: center;
    }
    .res-success { background: rgba(16, 185, 129, 0.12); border: 1px solid #10b981; color: #10b981; }
    .res-warn { background: rgba(245, 158, 11, 0.12); border: 1px solid #f59e0b; color: #f59e0b; }
    .res-danger { background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; color: #ef4444; }

    .guest-table-val { font-size: 1.35rem; font-weight: 900; margin-top: 4px; }
    
    .dietary-badge {
      display: inline-block;
      margin-top: 8px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #f87171;
      color: #fca5a5;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* FLOOR PLAN GRID */
    .seating-section { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 14px; }
    .seating-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .seating-title { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: 800; }
    .btn-refresh-seats { background: none; border: 1px solid var(--border); color: #94a3b8; padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; cursor: pointer; }
    .btn-refresh-seats:hover { border-color: var(--gold); color: var(--gold); }

    .tables-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 280px; overflow-y: auto; }
    .table-card { background: #182234; border: 1px solid var(--border); border-radius: 10px; padding: 10px 4px; text-align: center; cursor: pointer; transition: all 0.15s ease; }
    .table-card:active { transform: scale(0.96); }
    .table-card.selected-override { border-color: var(--gold); background: rgba(197, 160, 89, 0.2); }
    .table-card.full { opacity: 0.4; border-color: #ef4444; cursor: not-allowed; }
    .table-name { font-size: 0.85rem; font-weight: 800; color: #f8fafc; }
    .table-zone { font-size: 0.65rem; color: #64748b; font-weight: 600; }
    .table-quota { font-size: 0.68rem; color: #94a3b8; margin-top: 2px; }
    .table-badge { display: inline-block; font-size: 0.58rem; font-weight: 800; padding: 2px 5px; border-radius: 4px; margin-top: 4px; }
    .table-badge.avail { background: rgba(59, 130, 246, 0.25); color: #60a5fa; }
    .table-badge.full-tag { background: rgba(239, 68, 68, 0.25); color: #f87171; }
  </style>
</head>
<body>

  <div class="scanner-card">
    <div class="top-bar">
      <div class="top-title" id="pageTitle">RECEPTION DESK</div>
      <div>
        <span style="font-size: 0.75rem; color: #94a3b8; margin-right: 4px;">PIN:</span>
        <input type="password" id="staffPin" class="pin-box" value="2026">
      </div>
    </div>

    <!-- LIVE COUNTER STATS BAR -->
    <div class="live-stats-bar">
      <div class="stat-item">
        <span class="stat-lbl">REGISTERED</span>
        <span class="stat-num" id="statReg">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-lbl">CHECKED IN</span>
        <span class="stat-num green" id="statIn">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-lbl">REMAINING</span>
        <span class="stat-num" id="statRem">0</span>
      </div>
      <div class="stat-item">
        <span class="stat-lbl">ATTENDANCE</span>
        <span class="stat-num highlight" id="statRate">0%</span>
      </div>
    </div>

    <input 
      type="text" 
      id="quickBarcodeInput" 
      class="manual-input" 
      placeholder="Scan barcode or enter Guest ID..." 
      onkeydown="if(event.key==='Enter'){ triggerScan(this.value.trim()); this.value=''; }"
    >

    <label for="nativeCameraInput" class="cam-trigger-btn">
      📷 SCAN QR CODE
      <span>Align camera with guest QR Code</span>
    </label>
    <input 
      type="file" 
      id="nativeCameraInput" 
      accept="image/*" 
      capture="environment" 
      style="display: none;" 
      onchange="handleImageCapture(this)"
    >

    <div id="loadingStatus" class="loading-status">Processing QR Code...</div>
    <canvas id="hiddenCanvas" style="display:none;"></canvas>

    <div id="resultBox" class="result-card">
      <h3 id="resTitle" style="font-size: 1.1rem; font-weight: 800;"></h3>
      <p id="resGuest" style="color: #cbd5e1; font-size: 0.9rem; margin-top: 3px; font-weight: 600;"></p>
      <div id="resTable" class="guest-table-val"></div>
      <div id="resDietary" class="dietary-badge" style="display:none;"></div>
    </div>

    <!-- FLOOR PLAN TABLES SECTION -->
    <div class="seating-section">
      <div class="seating-header">
        <span class="seating-title">Tables & Quota (Floor Plan): <span id="activeOverrideText" style="color:var(--gold); font-size:0.68rem;">(Default)</span></span>
        <button type="button" class="btn-refresh-seats" onclick="refreshDashboard()">↻ Refresh</button>
      </div>

      <div class="tables-grid" id="tablesContainer">
        <div style="color: #64748b; font-size: 0.75rem; grid-column: span 3; text-align: center;">Loading tables...</div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfFvxF5nIADv6uwLXA9sDtJYZmdN10h2SpE5Pa2bz2_Im0c-i1Ckwxv_M6OOWXAvdX/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const eventCode = urlParams.get('event') || "EA26-JKT";

    document.getElementById('pageTitle').innerText = "DESK — " + eventCode;

    let activeGuestId = "";
    let selectedTableOverride = "";

    function handleImageCapture(input) {
      if (!input.files || input.files.length === 0) return;
      const file = input.files[0];
      const loader = document.getElementById('loadingStatus');
      loader.style.display = "block";
      loader.innerText = "Processing QR Image...";

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('hiddenCanvas');
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          const MAX = 800;
          let w = img.width, h = img.height;
          if (w > h && w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
          else if (h > MAX) { w = Math.round((w * MAX) / h); h = MAX; }
          canvas.width = w; canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);
          const imgData = ctx.getImageData(0, 0, w, h);
          const code = jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: "dontInvert" });
          loader.style.display = "none";
          input.value = "";
          if (code && code.data) triggerScan(code.data.trim());
          else alert("QR Code not detected. Please ensure image clarity.");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function selectOverrideTable(tableName) {
      if (selectedTableOverride === tableName) {
        selectedTableOverride = "";
        document.getElementById('activeOverrideText').innerText = "(Default)";
      } else {
        selectedTableOverride = tableName;
        document.getElementById('activeOverrideText').innerText = "(Override: " + tableName + ")";
      }
      loadTables();
    }

    function triggerScan(id) {
      if (!id) return;
      activeGuestId = id;
      const pin = document.getElementById('staffPin').value;
      const box = document.getElementById('resultBox');
      box.style.display = "block";
      box.className = "result-card res-warn";
      document.getElementById('resTitle').innerText = "VERIFYING...";
      document.getElementById('resGuest').innerText = "Pass ID: " + id;
      document.getElementById('resTable').innerText = "Please wait...";

      const checkInUrl = APPS_SCRIPT_URL + 
        "?action=checkIn&id=" + encodeURIComponent(id) + 
        "&pin=" + encodeURIComponent(pin) + 
        "&event=" + encodeURIComponent(eventCode) +
        "&table=" + encodeURIComponent(selectedTableOverride) +
        "&t=" + Date.now();

      fetch(checkInUrl)
        .then(res => res.json())
        .then(data => {
          handleScanResult(data);
          refreshDashboard();
        })
        .catch(err => {
          box.className = "result-card res-danger";
          document.getElementById('resTitle').innerText = "✕ CONNECTION ERROR";
          document.getElementById('resGuest').innerText = "Unable to reach server.";
          document.getElementById('resTable').innerText = "";
        });
    }

    function handleScanResult(res) {
      const box = document.getElementById('resultBox');
      const dietBox = document.getElementById('resDietary');
      box.style.display = "block";
      dietBox.style.display = "none";

      if (res.status === "success" || res.status === "already_checked_in") {
        box.className = "result-card " + (res.status === "success" ? "res-success" : "res-warn");
        document.getElementById('resTitle').innerText = res.status === "success" ? "✓ VALIDATED & CHECKED IN" : "⚠️ ALREADY CHECKED IN";
        
        let plusTag = res.hasPlusOne ? " [+1 Guest]" : "";
        let tierTag = res.category && res.category !== "GUEST" ? " [" + res.category + "]" : "";
        document.getElementById('resGuest').innerText = res.name + " (" + res.company + ")" + tierTag + plusTag;
        
        document.getElementById('resTable').innerText = (res.status === "already_checked_in" ? "CURRENT TABLE: " : "TABLE: ") + res.table;

        if (res.dietary && res.dietary.trim()) {
          dietBox.style.display = "inline-block";
          dietBox.innerText = "DIETARY ALERT: " + res.dietary;
        }
      } else {
        box.className = "result-card res-danger";
        document.getElementById('resTitle').innerText = "✕ NOT RECOGNISED";
        document.getElementById('resGuest').innerText = res.message || "Guest identifier not found.";
        document.getElementById('resTable').innerText = "";
      }
    }

    function loadLiveStats() {
      fetch(APPS_SCRIPT_URL + "?action=getLiveStats&event=" + encodeURIComponent(eventCode) + "&t=" + Date.now())
        .then(res => res.json())
        .then(s => {
          if (!s) return;
          document.getElementById('statReg').innerText = s.registered || 0;
          document.getElementById('statIn').innerText = s.checkedIn || 0;
          document.getElementById('statRem').innerText = s.remaining || 0;
          document.getElementById('statRate').innerText = s.rate || "0%";
        })
        .catch(err => {});
    }

    function loadTables() {
      const container = document.getElementById('tablesContainer');
      if (!container) return;

      fetch(APPS_SCRIPT_URL + "?action=getTableAvailability&event=" + encodeURIComponent(eventCode) + "&t=" + Date.now())
        .then(res => res.json())
        .then(tables => {
          if (!tables || tables.length === 0) {
            container.innerHTML = "<div style='color:#94a3b8; font-size:0.75rem; grid-column:span 3; text-align:center;'>No tables configured in Tables_Config.</div>";
            return;
          }
          container.innerHTML = "";
          tables.forEach(t => {
            const isSelected = selectedTableOverride === t.name;
            const card = document.createElement('div');
            card.className = "table-card" + (t.isFull ? " full" : "") + (isSelected ? " selected-override" : "");
            card.onclick = function() {
              if (t.isFull && !isSelected) { alert(t.name + " is fully occupied (" + t.capacity + " seats)."); return; }
              selectOverrideTable(t.name);
            };
            card.innerHTML = `
              <div class="table-name">${t.name}</div>
              ${t.zone ? `<div class="table-zone">${t.zone}</div>` : ''}
              <div class="tf-occ" style="font-size: 0.68rem; color: #94a3b8; margin-top:2px;">${t.occupied}/${t.capacity} Seats</div>
              <div class="table-badge ${t.isFull ? 'full-tag' : 'avail'}">${t.isFull ? 'FULL' : t.remaining + ' LEFT'}</div>
            `;
            container.appendChild(card);
          });
        })
        .catch(err => {
          container.innerHTML = "<div style='color:#ef4444; font-size:0.75rem; grid-column:span 3; text-align:center;'>Failed to load tables.</div>";
        });
    }

    function refreshDashboard() {
      loadLiveStats();
      loadTables();
    }

    window.onload = function() {
      refreshDashboard();
      setInterval(refreshDashboard, 15000);
    };
  </script>
</body>
</html>
